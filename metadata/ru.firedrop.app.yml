Name: FireDrop
Summary: Fast file and folder transfer over the local Wi-Fi network
Description: |-
  FireDrop moves files and whole folders directly between devices on the same
  local Wi-Fi network: phone to computer, computer to phone and phone to phone.
  No internet, no cloud and no accounts - the transfer does not leave the room.

  - Folders are sent whole: nested folder structure is preserved on the receiver.
  - Speed is limited only by the Wi-Fi network (tens of MB/s is realistic);
    nothing is uploaded anywhere in between.
  - Connection by scanning a QR code or by a six-digit code with limited attempts.
  - Incoming files are never overwritten: duplicates get number-suffixed names.
  - Russian and English interface; it follows the device language and can be
    switched manually in the settings.

  The traffic is plain HTTP inside the local network only: the app serves and
  connects to explicit IP:port addresses the user sees on screen (a VPN must be
  turned off - the app warns about that itself).

  Licensed under the GNU GPL v3 or later; the source code is open.

